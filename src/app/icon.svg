<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AI Teacher Lab Mediouna">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#060B16"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <!-- Deep navy rounded container with crisp brand teal rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2DD4BF" stroke-opacity="0.38" stroke-width="1.75"/>
  <!-- 16:9 Ivory Presentation Stage -->
  <rect x="10" y="14.5" width="44" height="26.5" rx="4.5" fill="#FAF8F4"/>
  <!-- Open-book / classroom horizon inside stage -->
  <path d="M16.5 34.5 C20.8 31.6, 26.5 31.6, 32 34.5 C37.5 31.6, 43.2 31.6, 47.5 34.5" fill="none" stroke="#0B1220" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Brand Teal 4-point AI spark centered above horizon -->
  <path d="M32 18.2 L34.3 23.9 L40 26.2 L34.3 28.5 L32 34.2 L29.7 28.5 L24 26.2 L29.7 23.9 Z" fill="url(#teal)"/>
  <!-- Bilingual dual-bar accent under stage (FR LTR + AR RTL symmetry) -->
  <rect x="14" y="46.5" width="15" height="3.4" rx="1.7" fill="#FAF8F4" fill-opacity="0.94"/>
  <rect x="35" y="46.5" width="15" height="3.4" rx="1.7" fill="#2DD4BF"/>
</svg>
