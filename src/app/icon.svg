<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AI Teacher Lab Mediouna">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#060B16"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <!-- Deep navy rounded container with subtle teal rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#14B8A6" stroke-opacity="0.32" stroke-width="1.5"/>
  <!-- 16:9 Presentation Stage Frame -->
  <rect x="10" y="15" width="44" height="26" rx="4.5" fill="#FAF8F4"/>
  <!-- Open-book / classroom horizon inside stage -->
  <path d="M17 34.5 C21 31.8, 26.5 31.8, 32 34.5 C37.5 31.8, 43 31.8, 47 34.5" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Teal 4-point AI spark centered above horizon -->
  <path d="M32 18.8 L34.2 24.3 L39.7 26.5 L34.2 28.7 L32 34.2 L29.8 28.7 L24.3 26.5 L29.8 24.3 Z" fill="url(#teal)"/>
  <!-- Minimal bilingual dual-bar accent under stage (FR LTR + AR RTL symmetry) -->
  <rect x="14" y="46.5" width="15" height="3.2" rx="1.6" fill="#FAF8F4" fill-opacity="0.9"/>
  <rect x="35" y="46.5" width="15" height="3.2" rx="1.6" fill="#14B8A6"/>
</svg>
